# Builds LCD Mirror for macOS (Apple silicon, Intel) and Windows.
# Every run uploads the zips as workflow artifacts.  A tag v* also makes a DRAFT
# release with the zips and SHA256SUMS.txt, to be checked and published by hand.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-apple-silicon
          - os: macos-15-intel
            target: macos-intel
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (binary wheels only)
        run: "python -m pip install --only-binary=:all: -r requirements-build.txt"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Collect bundled licenses
        run: python packaging/collect_licenses.py
      - name: Build
        run: pyinstaller --noconfirm packaging/lcd_mirror_viewer.spec
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/LCD Mirror.app" "LCD-Mirror-${{ matrix.target }}.zip"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/LCD Mirror" -DestinationPath "LCD-Mirror-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: LCD-Mirror-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum LCD-Mirror-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          --title "LCD Mirror $GITHUB_REF_NAME"
          --notes "LCD Mirror, a companion helper for the P-MONEY MPC3000 update. Unsigned builds: see the README for first-run steps and how to check SHA256SUMS.txt."
          LCD-Mirror-*.zip SHA256SUMS.txt
